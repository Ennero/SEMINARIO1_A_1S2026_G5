services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semi-social-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semi-social-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped