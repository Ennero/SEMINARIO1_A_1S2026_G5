services:
  db:
    image: postgres:15-alpine
    container_name: semi-social-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-semisocial_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semisocial_password}
      POSTGRES_DB: semisocial_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-semisocial_user} -d semisocial_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semi-social-backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semi-social-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
