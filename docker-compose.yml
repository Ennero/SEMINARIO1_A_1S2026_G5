services:
  db:
    image: postgres:15-alpine
    container_name: semi-social-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-semisocial_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semisocial_password}
      POSTGRES_DB: semisocial_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-semisocial_user} -d semisocial_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semi-social-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:${FRONTEND_PORT:-3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-semisocial_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-semisocial_password}
      DB_NAME: semisocial_db
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET}
      COGNITO_REGION: ${COGNITO_REGION}
      S3_BUCKET_IMAGES: ${S3_BUCKET_IMAGES}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      IMAGE_UPLOAD_API_URL: ${IMAGE_UPLOAD_API_URL}
      FACIAL_MATCH_THRESHOLD: ${FACIAL_MATCH_THRESHOLD:-90}
      LEX_BOT_ID: ${LEX_BOT_ID:-DWUDBVG2LS}
      LEX_BOT_ALIAS_ID: ${LEX_BOT_ALIAS_ID:-TSTALIASID}
      LEX_LOCALE_ID: ${LEX_LOCALE_ID:-es_419}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semi-social-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data: