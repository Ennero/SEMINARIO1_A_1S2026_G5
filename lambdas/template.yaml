AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for Semi-Social Image Uploader Lambda

Globals:
  Function:
    Timeout: 10
    MemorySize: 256

Resources:
  ImageUploaderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: imageUploader.handler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
      Events:
        UploadApi:
          Type: Api
          Properties:
            Path: /upload
            Method: post

Parameters:
  S3BucketName:
    Type: String
    Description: El nombre del bucket S3 donde se subiran las imagenes (e.g., semi1proyecto-g6)
    Default: semi1proyecto-g6

Outputs:
  UploadApiEndpoint:
    Description: "API Gateway endpoint URL para la funcion POST /upload"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/upload/"
